name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        run: |
          PLUGIN_SLUG="bbb-sportspress-sync"
          mkdir -p build/${PLUGIN_SLUG}
          rsync -av --exclude='.git' --exclude='.github' --exclude='.DS_Store' --exclude='.gitignore' --exclude='docs/' --exclude='build/' . build/${PLUGIN_SLUG}/
          cd build
          zip -r ${PLUGIN_SLUG}-${{ steps.version.outputs.VERSION }}.zip ${PLUGIN_SLUG}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: build/bbb-sportspress-sync-${{ steps.version.outputs.VERSION }}.zip
